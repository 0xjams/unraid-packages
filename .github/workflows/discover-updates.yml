name: Discover Package Updates

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      PROPOSAL_BRANCH: automation/update-proposals
      BASE_BRANCH: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare proposal branch
        run: |
          git fetch origin "$PROPOSAL_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$PROPOSAL_BRANCH"; then
            git checkout -B "$PROPOSAL_BRANCH" "origin/$PROPOSAL_BRANCH"
          else
            git checkout -B "$PROPOSAL_BRANCH" "origin/$BASE_BRANCH"
          fi

      - name: Discover package updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/discover-updates.py \
            --repo-root . \
            --proposal-path updates/proposal.json \
            --summary-path updates/discovery-summary.md

      - name: Commit proposal changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/proposal.json updates/discovery-summary.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(automation): refresh package update proposal"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push proposal branch
        run: |
          git push --set-upstream origin "$PROPOSAL_BRANCH"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pr_number=$(gh pr list --head "$PROPOSAL_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$PROPOSAL_BRANCH" \
              --title "chore(automation): package update proposal" \
              --body-file updates/discovery-summary.md
            create_status=$?
            if [ "$create_status" -ne 0 ]; then
              echo "::warning::Could not create PR with GITHUB_TOKEN."
              echo "::warning::Enable Settings > Actions > General > Workflow permissions: Read and write, and allow GitHub Actions to create pull requests."
              echo "::warning::Or create it manually: gh pr create --base $BASE_BRANCH --head $PROPOSAL_BRANCH --title 'chore(automation): package update proposal' --body-file updates/discovery-summary.md"
            fi
          else
            gh pr edit "$pr_number" \
              --title "chore(automation): package update proposal" \
              --body-file updates/discovery-summary.md
            edit_status=$?
            if [ "$edit_status" -ne 0 ]; then
              echo "::warning::Could not update PR #$pr_number with GITHUB_TOKEN."
            fi
          fi
          set -e
